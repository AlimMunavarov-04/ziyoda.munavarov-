# Весь сайт идёт через программу (server/app.py): она пускает только после входа.
server {
    listen 80;
    server_name ziyoda.munavarovbi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ziyoda.munavarovbi.com;

    ssl_certificate /etc/letsencrypt/live/ziyoda.munavarovbi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyoda.munavarovbi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
