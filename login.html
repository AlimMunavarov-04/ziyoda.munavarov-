<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — Menschen A1.1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <form class="login-box card" id="login-form" autocomplete="on">
    <div class="brand"><div class="brand-mark">A1</div><div><b>Menschen A1.1</b><small>уроки немецкого</small></div></div>
    <label class="field">Логин
      <input name="login" id="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="field">Пароль
      <input name="password" id="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="form-err" id="err" hidden></div>
    <button class="btn primary wide" type="submit" id="submit">Войти</button>
    <p class="muted small">Логин и пароль выдаёт учитель.</p>
  </form>
  <script src="js/login.js"></script>
</body>
</html>
